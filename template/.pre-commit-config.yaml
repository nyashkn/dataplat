# Fast gates only (a few seconds). Heavier ones run in `just ci` and CI.
# Project tools run from the project venv (`uv run --frozen`), so versions match uv.lock exactly and
# there is no second copy of ruff to drift. Owner-reviewed (CODEOWNERS).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: no-commit-to-branch   # agents work on branches/worktrees; main moves by PR
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # --force-exclude: pre-commit passes paths explicitly, and ruff only honours `exclude`
      # (contracts/_generated) for explicit paths with this flag.
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check (autofix)
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix --force-exclude
        language: system
        types: [python]
      - id: dataplat-lint
        name: architecture rules (DPA001-DPA008)
        entry: uv run --frozen dataplat lint
        language: system
        types: [python]
        files: ^src/
      - id: import-contracts
        name: layer contracts (import-linter)
        entry: uv run --frozen lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: contracts-fresh
        name: generated contracts are fresh
        entry: uv run --frozen dataplat contracts check
        language: system
        files: ^src/.*/contracts/
        pass_filenames: false
      - id: impacted-tests
        name: impacted tests
        entry: uv run --frozen just test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: duplication-ratchet
        name: duplication ratchet (jscpd)
        entry: uv run --frozen just dupes
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
