# Unbounded checks that are too slow or too noisy for every PR.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --locked --all-extras
      - name: full suite + live-fire gate
        run: uv run --frozen just test-all
      - name: lockfile matches pyproject
        run: uv lock --check
      - name: known-vulnerable dependencies
        run: uv export --frozen --no-hashes --all-extras --no-emit-project --no-emit-package dataplat --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip
      - name: duplication report (informational)
        run: uv run --frozen just dupes-report || true
